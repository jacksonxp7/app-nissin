<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IKEDA App</title>
    <link rel="stylesheet" href="./scss/style.css">
    <link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>
    <audio id="cursor_s" src="./songs/pes_5_cursor.mp3" preload="auto"></audio>
    <audio id="decide_s" src="./songs/pes_5_decide.mp3" preload="auto"></audio>
    <audio id="z_s" src="./songs/z_pickup.mp3" preload="auto"></audio>
    <audio id="mario_coin_s" src="./songs/mario_coin.mp3" preload="auto"></audio>

    <div id="alertas-validade" class="hide"></div>

    <header id="logo">
        <div id="imagem_logo"><img src="./img/logo.png" alt="Logo"></div>
        <div id="ikeda_nome">IKEDA</div>
        <div class="btn_header show" id="abrir_menu_icon">
            <div class="tresp"></div><div class="tresp"></div><div class="tresp"></div>
        </div>
        <div class="btn_header hide" id="fechar_menu_icon">
            <div class="tresp_x1"></div><div class="tresp_x2"></div>
        </div>
    </header>

    <nav id="menu" class="hide">
        <button class="btn_menu" id="btn_abastecer">Abastecer</button>
        <button class="btn_menu" id="btn_estoque">Estoque</button>
        <button class="btn_menu" id="btn_valida">Validades</button>
        <button class="btn_menu" id="btn_dashboard">Dashboard</button>
        <button class="btn_menu" id="btn_layout">Layout</button>
        <button class="btn_menu" id="btn_giro">Giro de Vendas</button>
        <button class="btn_menu" id="btn_configs">Configurações</button>
        <button class="btn_menu" id="btn_login">Login Confiança</button>
    </nav>

    <main id="app" class="show">
        <div id="abastecimento" class="hide pagetabela">
            <div class="input_adicionar">
                <input list="lista-itens" class="inpute" id="abastecer_item" placeholder="Produto">
                <datalist id="lista-itens"></datalist>
                <input type="number" id="quantidade_abastecer" class="inpute" placeholder="Qtd">
                <select id="unabastecer" class="inpute">
                    <option value="CX">CX</option><option value="UN">UN</option>
                </select>
                <button class="buttonadd" id="buttonadd">ADICIONAR</button>
            </div>
            <table class="tabelas"><thead><tr><th colspan="5">ABASTECIMENTO</th></tr></thead><tbody id="tbody"></tbody></table>
        </div>

        <div id="itens" class="hide pagetabela"></div>

        <div id="validades" class="hide pagetabela">
            <div class="input_adicionar">
                <input class="inpute" id="add_item_validade" list="lista-itens" placeholder="Produto">
                <input type="number" id="quantidade_itens_validade" class="inpute" placeholder="Qtd">
                <input type="date" id="validade_item_add" class="inpute">
                <button id="buttonadd_vldd" class="buttonadd">AGENDAR</button>
            </div>
            <table class="tabelas"><tbody id="tbody_vldd"></tbody></table>
            <button id="imprimir_pdf" class="oimprimir">BAIXAR PDF</button>
        </div>

        <div id="dashboard" class="hide pagetabela">
            <div class="dasboardtable"><h3>VALOR EM VENDAS</h3><div id="vevt_em" class="dashboardview">R$ 0,00</div></div>
            <div id="dashboard-valores" style="width: 100%;"></div>
        </div>

        <div id="layout" class="hide pagetabela">
            <div class="marca_layout"><p>NISSIN</p><img src="img/layout/corredor_nissin1.jpeg"></div>
            <div class="marca_layout"><p>FINI</p><img src="img/layout/layout_fini.jpeg"></div>
        </div>

        <div id="giro_vendas" class="hide pagetabela">
            <div class="input_adicionar">
                <input type="text" id="giro_local" placeholder="Local" class="inpute">
                <input type="date" id="giro_data" class="inpute">
                <button id="btn_add_giro" class="buttonadd">REGISTRAR GIRO</button>
            </div>
            <div id="lista_giros"></div>
        </div>

        <div id="configs" class="hide pagetabela">
            <div class="config_container">
                <div class="config_card">
                    <h3>🔔 Notificações</h3>
                    <input type="number" id="cfg_dias_aviso" class="inpute" placeholder="Dias de antecedência">
                    <input type="text" id="cfg_horarios" class="inpute" placeholder="06:00, 13:00">
                </div>
                <div class="config_card">
                    <h3>📦 Ordem das Marcas</h3>
                    <div id="lista_marcas_sortable"></div>
                </div>
                <button id="salvar_configs" class="buttonadd">SALVAR TUDO</button>
            </div>
        </div>

        <div id="login" class="show pagetabela">
            <img src="./img/layout/login_confiança_jackson.jpeg" style="width: 80%; border-radius: 15px; margin-bottom: 20px;">
            <div id="nomelogado">Carregando...</div>
            <div class="botoes_confianca">
                <button id="logar_confianca" class="logar_confianca">LOGIN</button>
                <button id="logout_user_app" class="deslogar_confianca">LOGOUT</button>
            </div>
        </div>
    </main>
    <script type="module" src="./scripts/script.js"></script>
</body>
</html>
