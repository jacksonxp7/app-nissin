<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>IKEDA App</title>
    <link rel="stylesheet" href="./scss/style.css">
    <link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <audio id="cursor_s" src="./songs/pes_5_cursor.mp3" preload="auto"></audio>
    <audio id="decide_s" src="./songs/pes_5_decide.mp3" preload="auto"></audio>
    <audio id="z_s" src="./songs/z_pickup.mp3" preload="auto"></audio>
    <audio id="mario_coin_s" src="./songs/mario_coin.mp3" preload="auto"></audio>

    <div id="alertas-validade" class="hide"></div>

    <header id="logo">
        <div id="imagem_logo"><img src="./img/logo.png" alt="Logo"></div>
        <div id="ikeda_nome">IKEDA</div>
        <div class="btn_header show" id="abrir_menu_icon">
            <div class="tresp"></div>
            <div class="tresp"></div>
            <div class="tresp"></div>
        </div>
        <div class="btn_header hide" id="fechar_menu_icon">
            <div class="tresp"></div>
            <div class="tresp"></div>
            <div class="tresp"></div>
        </div>
    </header>

    <nav id="menu" class="hide">
        <button class="btn_menu" id="btn_abastecer">Abastecer</button>
        <button class="btn_menu" id="btn_estoque">Estoque</button>
        <button class="btn_menu" id="btn_valida">Validades</button>
        <button class="btn_menu" id="btn_dashboard">Dashboard</button>
        <button class="btn_menu" id="btn_layout">Layout</button>
        <button class="btn_menu" id="btn_giro">Giro de Vendas</button>
        <button class="btn_menu" id="btn_chat">Chat da Equipe</button>
        <button class="btn_menu" id="btn_configs">Configurações</button>
        <button class="btn_menu" id="btn_login">Perfil</button>
    </nav>

    <main id="app" class="show">
        <div id="abastecimento" class="hide pagetabela">
            <div class="input_adicionar">
                <input list="lista-itens" class="inpute" id="abastecer_item" placeholder="Produto">
                <datalist id="lista-itens"></datalist>
                <input type="number" id="quantidade_abastecer" class="inpute" placeholder="Qtd">
                <select id="unabastecer" class="inpute">
                    <option value="CX">CX</option>
                    <option value="UN">UN</option>
                </select>
                <button class="buttonadd" id="buttonadd">ADICIONAR</button>
            </div>
            <table class="tabelas">
                <thead>
                    <tr>
                        <th colspan="5">ABASTECIMENTO</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>

        <div id="itens" class="hide pagetabela"></div>

        <div id="validades" class="hide pagetabela">
            <div class="input_adicionar">
                <input class="inpute" id="add_item_validade" list="lista-itens" placeholder="Produto">
                <input type="number" id="quantidade_itens_validade" class="inpute" placeholder="Qtd">
                <input type="date" id="validade_item_add" class="inpute">
                <button id="buttonadd_vldd" class="buttonadd">AGENDAR</button>
            </div>
            <table class="tabelas">
                <tbody id="tbody_vldd"></tbody>
            </table>
            <button id="imprimir_pdf" class="oimprimir">BAIXAR PDF</button>
        </div>

        <div id="dashboard" class="hide pagetabela">
        </div>


        <div id="giro_vendas" class="hide pagetabela">
            <div class="input_adicionar">
                <select id="giro_local" class="inpute">
                    <option value="">Selecione a Marca</option>
                    <option value="PONTO EXTRA">⭐ PONTO EXTRA</option>
                </select>

                <input type="date" id="giro_data" class="inpute">

                <!-- Botão customizado para disparar a Câmera Nativa -->
                <div id="giro_foto_area"
                    style="background: #34495e; color: white; padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; margin-bottom: 10px;">
                    📸 TIRAR FOTO OU GALERIA
                </div>

                <!-- Preview da Foto -->
                <div id="preview_container" style="display:none; text-align:center; margin: 10px 0;">
                    <img id="giro_foto_preview" src=""
                        style="width: 120px; border-radius: 8px; border: 2px solid #2c3e50;">
                </div>

                <button id="btn_add_giro" class="buttonadd">REGISTRAR GIRO</button>
            </div>

            <div id="lista_giros" class="container_giros"></div>
        </div>


        <div id="layout" class="hide pagetabela"></div>

        <div id="configs" class="hide pagetabela">
            <div class="config_container">
                <div class="config_card">
                    <h3>🔔 Notificações</h3>
                    <div class="bloco">
                        <div class="p">prazo de aviso:</div>
                        <input type="number" id="cfg_dias_aviso" class="inpute" placeholder="Dias de antecedência">
                    </div>

                    <div class="bloco">
                        <div class="p">alarmes</div>
                        <input type="text" id="cfg_horarios" class="inpute" placeholder="06:00, 13:00">
                    </div>
                </div>
                <div class="config_card">
                    <h3>📦 Ordem das Marcas</h3>
                    <div id="lista_marcas_sortable"></div>
                </div>
                <button id="salvar_configs" class="buttonadd">SALVAR TUDO</button>
            </div>
        </div>

        <div id="login" class="show pagetabela">
        </div>

        <div id="chat" class="hide pagetabela">
            <!-- 1. TELA: LISTA DE CONVERSAS (HOME DO CHAT) -->
            <div id="chat_view_lista" class="chat_view">
                <div class="chat_header_top">
                    <h2>Mensagens</h2>
                </div>
                <div id="lista_conversas_ativas">
                    <!-- As conversas recentes aparecerão aqui -->
                </div>
                <button id="btn_novo_chat" class="fab_button">+</button>
            </div>

            <!-- 2. TELA: SELECIONAR CONTATO (NOVA CONVERSA) -->
            <div id="chat_view_contatos" class="chat_view hide">
                <div class="chat_header_top">
                    <button class="btn_voltar_chat">⬅</button>
                    <h2>Contatos</h2>
                </div>
                <div id="lista_todos_usuarios">
                    <!-- Todos os usuários do sistema aparecerão aqui -->
                </div>
            </div>

            <!-- 3. TELA: CONVERSA ABERTA (CHAT) -->
            <div id="chat_view_room" class="chat_view hide">
                <div class="chat_header_room">
                    <button class="btn_voltar_chat">⬅</button>
                    <img src="" id="chat_room_foto" class="chat_avatar">
                    <div class="chat_room_info">
                        <span id="chat_room_nome">Nome</span>
                        <small id="chat_room_status">online</small>
                    </div>
                </div>

                <div id="chat_mensagens"></div>

                <div id="chat_menu_opcoes" class="hide">
                    <button id="opt_foto">📸</button>
                    <button id="opt_validade">📅</button>
                </div>

                <div id="chat_input_area">
                    <button id="btn_chat_menu">+</button>
                    <input type="text" id="chat_input_texto" placeholder="Mensagem...">
                    <button id="btn_enviar_chat">➔</button>
                </div>
            </div>

            <!-- Modais Auxiliares -->
            <div id="modal_escolher_validade" class="hide">
                <div class="modal_conteudo">
                    <h3>Compartilhar Validade</h3>
                    <div id="lista_validades_chat"></div>
                    <button id="fechar_modal_vld" class="btn_fechar_modal">CANCELAR</button>
                </div>
            </div>
            <input type="file" id="chat_file_fallback" style="display:none;" accept="image/*">
        </div>


    </main>
    <script type="module" src="./scripts/script.js"></script>
</body>

</html>
